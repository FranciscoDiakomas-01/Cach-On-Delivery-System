services:
  app:
    build: .
    container_name: ecomerce_service
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
      REDIS_URL: redis://redis:6379
    networks:
      - backend

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5433:5433'
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - '6378:6378'
    volumes:
      - redis_data:/data
    networks:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: prometheus_monitoring
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana_dashboard
    restart: always
    ports:
      - '3001:3001'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

volumes:
  pg_data:
  redis_data:
  grafana_data:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge